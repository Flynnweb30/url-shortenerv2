<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - my.short</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f8fafc; padding:20px;">
        <div style="background:white; padding:40px; border-radius:16px; max-width:400px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.08);">
            <h1 style="text-align:center; font-size:28px; margin-bottom:8px;">Create Account</h1>
            <p style="text-align:center; color:#64748b; margin-bottom:30px;">Start shortening URLs for free</p>

            <form id="registerForm">
                <div style="margin-bottom:16px;">
                    <label style="display:block; font-weight:600; margin-bottom:6px;">Email</label>
                    <input type="email" id="registerEmail" required style="width:100%; padding:12px 16px; border:2px solid #e2e8f0; border-radius:8px; font-size:16px;">
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block; font-weight:600; margin-bottom:6px;">Password</label>
                    <input type="password" id="registerPassword" required minlength="6" style="width:100%; padding:12px 16px; border:2px solid #e2e8f0; border-radius:8px; font-size:16px;">
                    <div style="font-size:13px; color:#64748b; margin-top:4px;">Must be at least 6 characters</div>
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block; font-weight:600; margin-bottom:6px;">Confirm Password</label>
                    <input type="password" id="registerConfirm" required style="width:100%; padding:12px 16px; border:2px solid #e2e8f0; border-radius:8px; font-size:16px;">
                </div>
                <button type="submit" style="width:100%; padding:12px; background:#6C63F9; color:white; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer;">Create Account</button>
            </form>

            <div id="registerError" style="display:none; background:#fee2e2; color:#dc2626; padding:12px; border-radius:8px; margin-top:12px;"></div>

            <p style="text-align:center; margin-top:16px; color:#64748b;">
                Already have an account? <a href="/login.html" style="color:#6C63F9; text-decoration:none; font-weight:600;">Sign in</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { auth } from '/js/firebase.js';
        import { createUserWithEmailAndPassword, onAuthStateChanged, updateProfile } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';

        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = '/dashboard.html';
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerConfirm').value;
            const errorEl = document.getElementById('registerError');

            if (password !== confirm) {
                errorEl.textContent = 'Passwords do not match';
                errorEl.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters';
                errorEl.style.display = 'block';
                return;
            }

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                window.location.href = '/dashboard.html';
            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
