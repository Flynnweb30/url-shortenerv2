<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - my.short</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <a href="/" class="logo">
                    <span class="logo-icon">🔗</span>
                    <span>my<span class="highlight">.short</span></span>
                </a>
                <div class="nav-links">
                    <a href="/">Home</a>
                    <a href="/dashboard.html" class="active">Dashboard</a>
                    <span id="userName"></span>
                    <button onclick="logout()" class="btn-outline">Logout</button>
                </div>
                <button class="mobile-toggle" onclick="toggleMobile()">☰</button>
            </div>
        </div>
    </nav>

    <main style="padding: 40px 0;">
        <div class="container">
            <h1 style="font-size:32px; font-weight:700; margin-bottom:8px;">My Links</h1>
            <p style="color:#64748b; margin-bottom:30px;">Manage all your shortened URLs</p>

            <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px; margin-bottom:32px;">
                <div style="background:white; padding:20px; border-radius:12px; border:1px solid #e2e8f0; text-align:center;">
                    <div style="font-size:28px; font-weight:700;" id="totalLinks">0</div>
                    <div style="color:#64748b; font-size:14px;">Total Links</div>
                </div>
                <div style="background:white; padding:20px; border-radius:12px; border:1px solid #e2e8f0; text-align:center;">
                    <div style="font-size:28px; font-weight:700;" id="totalClicks">0</div>
                    <div style="color:#64748b; font-size:14px;">Total Clicks</div>
                </div>
                <div style="background:white; padding:20px; border-radius:12px; border:1px solid #e2e8f0; text-align:center;">
                    <div style="font-size:28px; font-weight:700;" id="activeLinks">0</div>
                    <div style="color:#64748b; font-size:14px;">Active Links</div>
                </div>
            </div>

            <div id="linksContainer"></div>
        </div>
    </main>

    <script type="module" src="/js/dashboard.js"></script>
    <script>
        function toggleMobile() {
            document.querySelector('.nav-links').classList.toggle('open');
        }

        async function logout() {
            const { signOut } = await import('https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js');
            const { auth } = await import('/js/firebase.js');
            await signOut(auth);
            window.location.href = '/';
        }
    </script>
</body>
</html>
