<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - my.short</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f8fafc; padding:20px;">
        <div style="background:white; padding:40px; border-radius:16px; max-width:400px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.08);">
            <h1 style="text-align:center; font-size:28px; margin-bottom:8px;">Welcome Back</h1>
            <p style="text-align:center; color:#64748b; margin-bottom:30px;">Sign in to manage your links</p>

            <form id="loginForm">
                <div style="margin-bottom:16px;">
                    <label style="display:block; font-weight:600; margin-bottom:6px;">Email</label>
                    <input type="email" id="loginEmail" required style="width:100%; padding:12px 16px; border:2px solid #e2e8f0; border-radius:8px; font-size:16px;">
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block; font-weight:600; margin-bottom:6px;">Password</label>
                    <input type="password" id="loginPassword" required style="width:100%; padding:12px 16px; border:2px solid #e2e8f0; border-radius:8px; font-size:16px;">
                </div>
                <button type="submit" style="width:100%; padding:12px; background:#6C63F9; color:white; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer;">Sign In</button>
            </form>

            <div id="loginError" style="display:none; background:#fee2e2; color:#dc2626; padding:12px; border-radius:8px; margin-top:12px;"></div>

            <p style="text-align:center; margin-top:16px; color:#64748b;">
                Don't have an account? <a href="/register.html" style="color:#6C63F9; text-decoration:none; font-weight:600;">Sign up</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { auth } from '/js/firebase.js';
        import { signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';

        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = '/dashboard.html';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = '/dashboard.html';
            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
