<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <rect width="400" height="300" fill="#f8fafc" rx="20"/>
    
    <!-- Background circles -->
    <circle cx="80" cy="60" r="40" fill="#6C63F9" opacity="0.08"/>
    <circle cx="320" cy="240" r="50" fill="#00D4AA" opacity="0.08"/>
    <circle cx="360" cy="40" r="25" fill="#6C63F9" opacity="0.05"/>
    
    <!-- Main link chain -->
    <g transform="translate(60, 80)">
        <!-- Link chain pieces -->
        <rect x="0" y="30" width="80" height="14" rx="7" fill="#CBD5E1"/>
        <rect x="20" y="15" width="80" height="14" rx="7" fill="#CBD5E1"/>
        <rect x="40" y="0" width="80" height="14" rx="7" fill="#CBD5E1"/>
        
        <!-- Link connections -->
        <circle cx="80" cy="37" r="10" fill="#94A3B8"/>
        <circle cx="60" cy="22" r="10" fill="#94A3B8"/>
        <circle cx="80" cy="7" r="10" fill="#94A3B8"/>
        
        <!-- Final shortened link -->
        <rect x="150" y="7" width="100" height="14" rx="7" fill="#6C63F9"/>
        <rect x="260" y="7" width="30" height="14" rx="7" fill="#6C63F9" opacity="0.6"/>
        
        <!-- Arrow -->
        <g transform="translate(140, 7)">
            <polygon points="0,0 10,7 0,14" fill="#6C63F9"/>
        </g>
        
        <!-- Sparkle effects -->
        <circle cx="270" cy="0" r="4" fill="#FBBF24" opacity="0.6"/>
        <circle cx="285" cy="20" r="3" fill="#FBBF24" opacity="0.4"/>
        <circle cx="260" cy="25" r="3" fill="#FBBF24" opacity="0.5"/>
    </g>
    
    <!-- Stats visualization -->
    <g transform="translate(50, 170)">
        <rect x="0" y="0" width="280" height="80" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1"/>
        
        <!-- Bar chart -->
        <rect x="30" y="40" width="25" height="25" rx="3" fill="#6C63F9" opacity="0.7"/>
        <rect x="70" y="25" width="25" height="40" rx="3" fill="#6C63F9" opacity="0.8"/>
        <rect x="110" y="10" width="25" height="55" rx="3" fill="#6C63F9"/>
        <rect x="150" y="35" width="25" height="30" rx="3" fill="#6C63F9" opacity="0.6"/>
        <rect x="190" y="20" width="25" height="45" rx="3" fill="#6C63F9" opacity="0.9"/>
        <rect x="230" y="30" width="25" height="35" rx="3" fill="#6C63F9" opacity="0.5"/>
    </g>
    
    <!-- Users icon -->
    <g transform="translate(320, 140)">
        <circle cx="15" cy="10" r="10" fill="#6C63F9" opacity="0.15"/>
        <circle cx="15" cy="10" r="5" fill="#6C63F9" opacity="0.3"/>
        <circle cx="40" cy="10" r="10" fill="#6C63F9" opacity="0.15"/>
        <circle cx="40" cy="10" r="5" fill="#6C63F9" opacity="0.3"/>
        <rect x="5" y="25" width="45" height="15" rx="7" fill="#6C63F9" opacity="0.15"/>
    </g>
</svg>